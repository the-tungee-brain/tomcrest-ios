name: Tomcrest
options:
  bundleIdPrefix: com.tomcrest
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
packages:
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 8.0.0
settings:
  base:
    SWIFT_VERSION: "5.10"
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  Tomcrest:
    type: application
    platform: iOS
    sources:
      - path: Tomcrest
    resources:
      - path: Tomcrest/Resources/Fonts
        type: folder
    dependencies:
      - package: GoogleSignIn
        product: GoogleSignIn
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tomcrest.app
        INFOPLIST_KEY_CFBundleDisplayName: Tomcrest
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: Tomcrest/Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLSchemes:
              - com.googleusercontent.apps.516814280647-h8h4ehcm6cpc925ndpmghh9mbcph9kqb
          - CFBundleTypeRole: Editor
            CFBundleURLName: com.tomcrest.app.schwab
            CFBundleURLSchemes:
              - tomcrest
        LSApplicationQueriesSchemes:
          - googlegmail
          - googlechrome
        UIAppFonts:
          - Inter-Regular.ttf
          - Inter-Medium.ttf
          - Inter-SemiBold.ttf
          - Inter-Bold.ttf
          - JetBrainsMono-Regular.ttf
          - JetBrainsMono-Medium.ttf
          - JetBrainsMono-SemiBold.ttf
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.tomcrest.watchlist-symbol-drag
            UTTypeDescription: Watchlist symbol drag payload
            UTTypeConformsTo:
              - public.data
            UTTypeTagSpecification: {}
  TomcrestTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: TomcrestTests
    dependencies:
      - target: Tomcrest
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tomcrest.app.tests
        GENERATE_INFOPLIST_FILE: YES
